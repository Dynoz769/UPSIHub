# Render Blueprint – deploys UPSIHub as one web service with a persistent disk.
# The disk keeps the SQLite database, uploaded photos and backups across
# restarts and redeploys (Render's filesystem is otherwise wiped).
services:
  - type: web
    name: upsihub
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    disk:
      name: upsihub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: DEMO
        value: "0"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

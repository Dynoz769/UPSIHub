.shop-card .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.shop-card h3 { font-size: 16.5px; font-weight: 750; }
.shop-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--text-2); margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }

.shop-hero { overflow: hidden; }

@media (min-width: 720px) { .shop-hero .cover { height: 260px; } }
.shop-hero .info { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.menu-item { display: flex; gap: 14px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); align-items: center; }

.thumb { width: 72px; height: 72px; border-radius: 12px; background: var(--surface-2); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--text-3); font-weight: 800; font-size: 20px; }

.thumb.sm { width: 44px; height: 44px; font-size: 13px; border-radius: 10px; }
.qty { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
.qty button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-sm); }

.review { padding: 14px 0; border-bottom: 1px solid var(--border); }

.stars { display: inline-flex; gap: 1px; color: #f59e0b; }

.star-input { display: flex; gap: 6px; justify-content: center; }
.star-input button { background: none; border: 0; padding: 2px; color: var(--surface-3); }
.star-input button .ic { width: 36px; height: 36px; }
.star-input button.on { color: #f59e0b; }

.cart-fab { position: fixed; left: 16px; right: 16px; bottom: 80px; z-index: 44; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-radius: 16px; background: linear-gradient(90deg, var(--primary-600), var(--primary)); color: #fff; font-weight: 700; box-shadow: var(--shadow-lg); border: 0; }
@media (min-width: 900px) { .cart-fab { left: auto; right: 24px; bottom: 24px; width: 360px; } }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .55); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: fadeBg .2s; }
@keyframes fadeBg { from { opacity: 0; } }
.modal { background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: up .25s cubic-bezier(.2, .9, .3, 1); overflow: hidden; }
.modal.wide { max-width: 720px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 17px; font-weight: 750; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 10px; justify-content: flex-end; }

.drawer { background: var(--surface); width: 100%; max-width: 440px; height: 100%; display: flex; flex-direction: column; animation: slide .25s cubic-bezier(.2, .9, .3, 1); box-shadow: var(--shadow-lg); }
@keyframes slide { from { transform: translateX(40px); opacity: .4; } }
.popover { position: fixed; z-index: 55; top: 70px; right: 12px; width: min(380px, calc(100vw - 24px)); max-height: 70vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); animation: fadeIn .18s; }
.popover .list { overflow-y: auto; }
.notif { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: color-mix(in srgb, var(--primary-50) 70%, transparent); }
.notif .n-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-top: 7px; flex: none; }
.notif:not(.unread) .n-dot { background: transparent; }
.menu-pop a, .menu-pop button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 16px; border: 0; background: none; text-align: left; font-size: 14px; font-weight: 550; color: var(--text); }
.menu-pop a:hover, .menu-pop button:hover { background: var(--surface-2); }

#toast-root { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); top: 76px; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #0f172a; color: #f1f5f9; font-size: 13.5px; box-shadow: var(--shadow-lg); animation: fadeIn .2s; cursor: pointer; }
.toast .ic { margin-top: 1px; }
.toast.success .ic { color: #34d399; }
.toast.error .ic { color: #fb7185; }
.toast.info .ic { color: #a5b4fc; }
.toast b { display: block; }

/* ---------- steps ---------- */
.steps { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
.steps .s { display: flex; align-items: center; gap: 8px; flex: 1; font-size: 12.5px; font-weight: 650; color: var(--text-3); }
.steps .s i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: var(--surface-2); border: 1px solid var(--border); flex: none; }
.steps .s.on { color: var(--text); }
.steps .s.on i { background: var(--primary); color: #fff; border-color: var(--primary); }
.steps .s.done i { background: var(--accent-600); color: #fff; border-color: var(--accent-600); }
.steps .bar { flex: 1; height: 2px; background: var(--border); border-radius: 2px; }
@media (max-width: 520px) { .steps .s span { display: none; } .steps .s { flex: none; } }
.pkg { position: relative; text-align: center; padding: 20px 14px 16px; border: 2px solid var(--border); border-radius: 16px; cursor: pointer; background: var(--surface); transition: .15s; display: flex; flex-direction: column; gap: 6px; }
.pkg:hover { border-color: var(--primary); }
.pkg.on { border-color: var(--primary); background: var(--primary-50); box-shadow: 0 10px 24px -14px var(--primary); }
.pkg .badge { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); }
.pkg .amt { font-size: 26px; font-weight: 850; color: var(--primary); }
.radio-card { display: flex; gap: 12px; align-items: center; padding: 14px; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; }
.radio-card:has(input:checked) { border-color: var(--primary); background: var(--primary-50); }
.radio-card input { accent-color: var(--primary); width: 18px; height: 18px; }
.radio-card.disabled { opacity: .5; cursor: not-allowed; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--border); }
.seg label { text-align: center; padding: 8px; border-radius: 9px; font-weight: 650; font-size: 13.5px; cursor: pointer; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }

/* ---------- wallet ---------- */
.wallet-card { position: relative; overflow: hidden; border-radius: 22px; padding: 24px; color: #fff; background: radial-gradient(600px 200px at 100% 100%, rgba(52, 211, 153, .35), transparent 60%), linear-gradient(135deg, var(--hero-1), var(--hero-3)); box-shadow: var(--shadow-lg); }
.wallet-card::before { content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; border: 28px solid rgba(255, 255, 255, .06); }

.wallet-actions button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .1); color: #fff; font-weight: 650; font-size: 12.5px; }

.wallet-actions .ic { width: 22px; height: 22px; }
.tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.tx:last-child { border: 0; }

.amt-in { color: var(--accent-600); font-weight: 750; }
.amt-out { color: var(--text); font-weight: 750; }
.amount-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.amount-chips button { padding: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13.5px; }
.amount-chips button:hover { border-color: var(--primary); color: var(--primary); }
.bank-box { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; border: 1px dashed var(--border); }
.bank-box > div { display: flex; justify-content: space-between; gap: 12px; }

/* ---------- orders ---------- */
.order-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow .15s; }
.order-card:hover { box-shadow: var(--shadow); }
.timeline { display: flex; justify-content: space-between; position: relative; margin: 8px 4px 4px; }
.timeline::before { content: ''; position: absolute; left: 14px; right: 14px; top: 14px; height: 3px; background: var(--surface-3); border-radius: 3px; }
.timeline .fill { position: absolute; left: 14px; top: 14px; height: 3px; background: var(--accent-600); border-radius: 3px; transition: width .4s; }
.timeline .t { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--text-3); width: 72px; text-align: center; }
.timeline .t i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--surface-3); }
.timeline .t.done { color: var(--text); }
.timeline .t.done i { background: var(--accent-600); border-color: var(--accent-600); color: #fff; }
.timeline .t.now i { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); }
.line-items { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.line-items > div { display: flex; justify-content: space-between; gap: 12px; }
.total-row { font-weight: 800; font-size: 16px; padding-top: 10px; border-top: 1px dashed var(--border); }

/* ---------- chat ---------- */
.chat-shell { display: grid; grid-template-columns: 1fr; height: calc(100vh - 64px - 34px - 48px - 80px); min-height: 460px; overflow: hidden; }
@media (min-width: 900px) { .chat-shell { grid-template-columns: 320px 1fr; height: calc(100vh - 64px - 34px - 72px); } }
.chat-list { border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
.chat-list a { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.chat-list a:hover { background: var(--surface-2); }
.chat-list a.active { background: var(--primary-50); }
.chat-list .unread-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.chat-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.msgs { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--primary); color: #fff; border-color: transparent; border-bottom-left-radius: 16px; border-bottom-right-radius: 6px; }
.msg img { border-radius: 10px; max-height: 260px; margin-bottom: 4px; cursor: zoom-in; }
.msg .meta { display: block; font-size: 10.5px; opacity: .65; margin-top: 3px; text-align: right; }
.day-sep { align-self: center; font-size: 11px; font-weight: 700; color: var(--text-3); background: var(--surface-2); padding: 3px 10px; border-radius: 99px; margin: 8px 0; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 42px; max-height: 120px; border-radius: 14px; padding: 10px 14px; }
@media (max-width: 899px) { .chat-shell.has-active .chat-list { display: none; } .chat-shell:not(.has-active) .chat-pane { display: none; } }

/* ---------- misc ---------- */
.upload-box { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1.5px dashed var(--border); border-radius: 14px; background: var(--surface-2); }
.upload-box .thumb { width: 64px; height: 64px; }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
.lightbox img { max-height: 90vh; border-radius: 12px; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 10px; }
.bars > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .b { width: 100%; max-width: 36px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--primary), var(--primary-600)); min-height: 3px; }

.auth-wrap { min-height: calc(100vh - 220px); display: grid; place-items: center; }
.demo-box { font-size: 12.5px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; border: 1px dashed var(--border); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

/* ---------- small-screen refinements ---------- */

@media (min-width: 900px) {
  #toast-root { top: auto; bottom: 24px; left: auto; right: 24px; transform: none; }
}

}

/* ---------- one-stop centre ---------- */

@media (min-width: 720px) { .hero-compact { padding: 36px 40px; } .hero-compact h1 { font-size: 34px; } }
.hero-search { display: flex; gap: 8px; margin-top: 18px; max-width: 640px; }
.hero-search .input { background: rgba(255, 255, 255, .96); color: #0f172a; border-color: transparent; }

.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1000px) { .tiles { grid-template-columns: repeat(5, 1fr); } }
.tile { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 16px; transition: transform .15s, box-shadow .15s, border-color .15s; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary); }
.tile b { font-size: 14.5px; margin-top: 6px; }
.tile .badge { position: absolute; top: 12px; right: 12px; }

.listing-card .cover { height: 150px; }
.listing-card .body { padding: 12px 14px; gap: 4px; }

.vehicle-card { overflow: hidden; }

.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
.slot { padding: 9px 0; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13px; }

.listing-layout { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .listing-layout { grid-template-columns: 1.15fr 1fr; } .listing-layout .gallery { position: sticky; top: 84px; } }
.gallery { overflow: hidden; }
.gallery-main { aspect-ratio: 4 / 3; background: var(--surface-2); display: grid; place-items: center; }

.gallery-thumbs { display: flex; gap: 8px; padding: 10px; overflow-x: auto; }

.multi-images { display: flex; flex-wrap: wrap; gap: 8px; }

.thumb-x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); background: var(--danger); color: #fff; display: grid; place-items: center; padding: 0; }

.thumb-add:hover { border-color: var(--primary); color: var(--primary); }

.kind-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kind-picker a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; font-size: 13px; font-weight: 650; text-align: center; color: var(--text-2); }
.kind-picker a .ic { width: 22px; height: 22px; }
.kind-picker a.on { border-color: var(--primary); background: var(--primary-50); color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

.check-chip:has(input:checked) { border-color: var(--primary); background: var(--primary-50); color: var(--primary); }
.fieldset { border: 1px dashed var(--border); border-radius: 14px; padding: 14px; margin: 0; }
.fieldset legend { font-size: 12px; font-weight: 800; color: var(--text-2); padding: 0 6px; }
.my-listing { display: flex; align-items: center; gap: 14px; padding: 12px 14px; transition: box-shadow .15s; }
.my-listing:hover { box-shadow: var(--shadow); }
.slot.on, .slot.on:hover { color: #fff !important; }
.rating-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.rating-bar i { display: block; height: 100%; background: #f59e0b; border-radius: 99px; }
.photo-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.photo-strip .thumb { padding: 0; border: 0; cursor: zoom-in; }
.thumb-btn { position: relative; padding: 0; border: 0; cursor: zoom-in; }
.img-count { position: absolute; right: 4px; bottom: 4px; background: rgba(15, 23, 42, .78); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 99px; }
td .img-count { right: 10px; bottom: 8px; }
.vehicle-card .cover[data-act] { cursor: zoom-in; }
.gallery-box { cursor: default; }
.gallery-box img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
.gal-nav, .gal-close { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; }
.gal-nav:hover, .gal-close:hover { background: rgba(255, 255, 255, .28); }
.gal-nav.prev { left: 16px; top: 50%; transform: translateY(-50%); }

  if (l.kind === 'LOST') rows.push(['Jenis', esc(M().lost_types[m.type])], ['Tarikh', esc(m.date)]);
  rows.push(['Lokasi', `${esc(l.location || '-')} · ${esc(l.campus)}`]);
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function primaryActions(l, mine) {
  if (mine) {
    return `
      <a class="btn btn-primary" href="#/listing/${l.id}/edit">${icon('edit')} Sunting</a>
      ${l.status === 'ACTIVE' && ['ITEM', 'ROOM'].includes(l.kind) ? `<button class="btn btn-ghost" data-act="listingStatus" data-id="${l.id}" data-status="SOLD">${icon('check')} Tanda ${l.kind === 'ROOM' ? 'sudah disewa' : 'terjual'}</button>` : ''}
      ${l.status === 'ACTIVE' ? `<button class="btn btn-ghost" data-act="listingStatus" data-id="${l.id}" data-status="CLOSED">${icon('lock')} Tutup iklan</button>` : ''}
      ${['CLOSED', 'SOLD'].includes(l.status) ? `<button class="btn btn-ghost" data-act="listingStatus" data-id="${l.id}" data-status="ACTIVE">${icon('refresh')} Aktifkan semula</button>` : ''}
      <button class="btn btn-danger" data-act="deleteListing" data-id="${l.id}">${icon('trash')} Padam</button>`;
  }
  const chat = (label) => `<button class="btn btn-ghost btn-lg" data-act="chatListing" data-id="${l.id}">${icon('chat')} ${label}</button>`;
  if (l.status !== 'ACTIVE') return chat('Chat pemilik');
  if (l.kind === 'ITEM') return `${l.price ? `<button class="btn btn-primary btn-lg" data-act="buyListing" data-id="${l.id}">${icon('bag')} Beli sekarang</button>` : ''}${chat(l.negotiable ? 'Chat & tawar harga' : 'Chat penjual')}`;
  if (l.kind === 'ROOM') return `${l.meta.booking_fee ? `<button class="btn btn-primary btn-lg" data-act="buyListing" data-id="${l.id}">${icon('home')} Bayar deposit tempahan ${rm(l.meta.booking_fee)}</button>` : ''}${chat('Chat & atur lawatan')}`;
  if (l.kind === 'EVENT') return `${l.price ? `<button class="btn btn-primary btn-lg" data-act="buyListing" data-id="${l.id}">${icon('ticket')} Beli tiket</button>` : ''}${chat('Tanya penganjur')}`;
  if (l.kind === 'JOB') return chat('Mohon melalui chat');
  return chat(l.meta.type === 'LOST' ? 'Saya jumpa barang ini' : 'Ini barang saya');
}

function kindFields(kind, l) {
  const m = l?.meta || {};
  const c = state.config;
  const money = (name, label, val, req = true, hint = '') => `<div class="field"><label>${label}${req ? ' *' : ''}</label><div class="input-prefix"><span>RM</span><input class="input" type="number" name="${name}" min="0" step="0.01" ${req ? 'required' : ''} value="${val != null ? senToInput(val) : ''}"></div>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
  if (kind === 'ITEM') {
    return `
      <div class="grid-2">
        <div class="field"><label>Kategori *</label><select class="input" name="category">${c.market_categories.map((x) => `<option ${l?.category === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
        <div class="field"><label>Keadaan *</label><select class="input" name="condition">${opts(M().conditions, l?.condition || 'BAIK')}</select></div>
        ${money('price', 'Harga', l?.price, true, 'Letak 0 untuk barang percuma.')}
        <div class="field"><label>Kuantiti</label><input class="input" type="number" name="stock" min="1" max="50" value="${l?.stock ?? 1}"></div>
      </div>
      <label class="check"><input type="checkbox" name="negotiable" ${l?.negotiable ? 'checked' : ''}> Harga boleh dirunding</label>`;
  }
  if (kind === 'ROOM') {
    return `
      <div class="grid-2">
        ${money('price', 'Sewa sebulan', l?.price)}
        <div class="field"><label>Boleh masuk mulai *</label><input class="input" type="date" name="available_from" required value="${esc(m.available_from || ymd())}"></div>
        <div class="field"><label>Jenis *</label><select class="input" name="room_type">${opts(M().room_types, m.room_type)}</select></div>
        <div class="field"><label>Penyewa *</label><select class="input" name="gender">${opts(M().genders, m.gender || 'CAMPUR')}</select></div>
        <div class="field"><label>Deposit</label><input class="input" name="deposit_note" maxlength="100" placeholder="Cth: 1 bulan + RM100 utiliti" value="${esc(m.deposit_note || '')}"></div>
        ${money('booking_fee', 'Yuran tempahan dalam talian', m.booking_fee ?? 0, false, 'Pelajar boleh membayar ini melalui dompet untuk menempah bilik. Letak 0 jika tidak mahu.')}
      </div>
      <div class="field"><label>Kemudahan</label><div class="row-wrap">${Object.entries(M().facilities).map(([k, v]) => `<label class="chip check-chip"><input type="checkbox" name="fac_${k}" ${(m.facilities || []).includes(k) ? 'checked' : ''}> ${esc(v)}</label>`).join('')}</div></div>`;
  }
  if (kind === 'JOB') {
    return `
      <div class="grid-2">
        <div class="field"><label>Majikan / syarikat *</label><input class="input" name="employer" required minlength="2" maxlength="80" value="${esc(m.employer || '')}"></div>
        <div class="field"><label>Waktu kerja</label><input class="input" name="schedule" maxlength="120" placeholder="Cth: Sabtu & Ahad, 10 pagi – 6 petang" value="${esc(m.schedule || '')}"></div>
        ${money('price', 'Bayaran', l?.price)}
        <div class="field"><label>Per *</label><select class="input" name="pay_unit">${opts(Object.fromEntries(Object.entries(M().pay_units).map(([k, v]) => [k, v.replace(/^se/, '')])), m.pay_unit || 'JAM')}</select></div>
      </div>`;
  }
  if (kind === 'EVENT') {
    const dt = m.event_at ? new Date(m.event_at) : null;
    const local = dt ? `${ymd(dt)}T${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}` : '';
    return `
      <div class="grid-2">
        <div class="field"><label>Tarikh & masa *</label><input class="input" type="datetime-local" name="event_at" required value="${local}"></div>
        <div class="field"><label>Tempat *</label><input class="input" name="venue" required minlength="3" maxlength="120" value="${esc(m.venue || '')}"></div>
        ${money('price', 'Harga tiket', l?.price ?? 0, false, 'Letak 0 untuk event percuma (tiada tiket).')}
        <div class="field"><label>Bilangan tiket</label><input class="input" type="number" name="stock" min="0" max="5000" value="${l?.stock ?? 100}"><span class="hint">Diperlukan jika tiket berbayar.</span></div>
      </div>`;
  }
  return `
    <div class="grid-2">
      <div class="field"><label>Jenis *</label><select class="input" name="type">${opts({ LOST: 'Saya kehilangan barang', FOUND: 'Saya terjumpa barang' }, m.type || 'LOST')}</select></div>
      <div class="field"><label>Tarikh *</label><input class="input" type="date" name="date" required max="${ymd()}" value="${esc(m.date || ymd())}"></div>
    </div>`;
}

      ${l ? '' : `<div class="kind-picker">${Object.entries(KINDS).map(([k, v]) => `<a href="#/post?kind=${k}" class="card ${k === kind ? 'on' : ''}">${icon(v.ic)}<span>${v.title}</span></a>`).join('')}</div>`}
      <form class="card pad stack" data-form="saveListing" data-kind="${kind}" data-id="${l?.id || ''}">
        <div class="field"><label>Tajuk *</label><input class="input" name="title" required minlength="5" maxlength="100" value="${esc(l?.title || '')}" placeholder="${{ ITEM: 'Cth: Kalkulator Casio fx-570EX', ROOM: 'Cth: Bilik single Taman Bernam Jaya – perempuan', JOB: 'Cth: Pembantu kedai hujung minggu', EVENT: 'Cth: Konsert Amal Kolej 2026', LOST: 'Cth: Hilang dompet hitam di kafeteria' }[kind]}"></div>

      </form>
    </div>`;
}

page('/listing/:id/edit', async ({ id }) => {

forms.saveListing = async (d, form) => {
  const kind = form.dataset.kind;
  const body = { kind, title: d.title, description: d.description, campus: d.campus, location: d.location, images: JSON.parse(d.images || '[]'), meta: {} };
  if (kind === 'ITEM') Object.assign(body, { category: d.category, condition: d.condition, price: toSen(d.price), stock: Number(d.stock || 1), negotiable: d.negotiable === 'on' });
  if (kind === 'ROOM') {
    body.price = toSen(d.price);
    body.meta = {
      room_type: d.room_type, gender: d.gender, available_from: d.available_from, deposit_note: d.deposit_note,
      booking_fee: d.booking_fee ? toSen(d.booking_fee) : 0,
      facilities: Object.keys(M().facilities).filter((k) => d[`fac_${k}`] === 'on')
    };
  }
  if (kind === 'JOB') { body.price = toSen(d.price); body.meta = { employer: d.employer, schedule: d.schedule, pay_unit: d.pay_unit }; }
  if (kind === 'EVENT') { body.price = d.price ? toSen(d.price) : 0; body.stock = Number(d.stock || 0); body.meta = { event_at: new Date(d.event_at).getTime(), venue: d.venue }; }
  if (kind === 'LOST') body.meta = { type: d.type, date: d.date };
  const id = form.dataset.id;
  const { listing } = await api(id ? 'PATCH' : 'POST', id ? `/api/listings/${id}` : '/api/listings', body);
  toast(id ? 'Iklan dikemas kini.' : 'Iklan anda kini disiarkan!', 'success');
  location.hash = `#/listing/${listing.id}`;
};

const fmtBytes = (n) => (n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const TABLE_LABEL = { users: 'Pengguna', shops: 'Kedai', items: 'Item menu', vehicles: 'Kenderaan', listings: 'Iklan', orders: 'Pesanan', transactions: 'Transaksi dompet', messages: 'Mesej chat', reviews: 'Ulasan kedai', seller_reviews: 'Ulasan penjual', disputes: 'Pertikaian' };

async function system() {
  const s = await api('GET', '/api/admin/system');
  const ok = s.integrity.join() === 'ok';
  const ledgerOk = !s.ledger_mismatches.length;
  return `
    <div class="stack">
      <div class="grid-3">
        <div class="card stat"><div class="between"><span class="label">Integriti database</span><span class="stat-icon ${ok ? 'green' : 'red'}">${icon(ok ? 'check' : 'alert')}</span></div><div class="value">${ok ? 'OK' : 'Rosak'}</div><div class="sub">${ok ? 'Struktur fail database sihat' : esc(s.integrity.join('; '))}</div></div>
        <div class="card stat"><div class="between"><span class="label">Audit lejar dompet</span><span class="stat-icon ${ledgerOk ? 'green' : 'red'}">${icon(ledgerOk ? 'check' : 'alert')}</span></div><div class="value">${ledgerOk ? 'Seimbang' : `${s.ledger_mismatches.length} isu`}</div><div class="sub">Setiap baki = jumlah transaksi pengguna</div></div>
        <div class="card stat"><div class="between"><span class="label">Saiz database</span><span class="stat-icon">${icon('package')}</span></div><div class="value">${fmtBytes(s.db_size)}</div><div class="sub">SQLite · WAL · synchronous=FULL</div></div>
      </div>
      ${ledgerOk ? '' : `<div class="alert danger">${icon('alert')}<div><b>Baki tidak sepadan dengan lejar:</b> ${s.ledger_mismatches.map((m) => `${esc(m.name)} (baki ${rm(m.balance)}, lejar ${rm(m.ledger)})`).join(', ')}</div></div>`}
      <div class="grid-2" style="align-items:start">
        <section class="card">
          <div class="card-head"><div><h2 class="section-title">Sandaran database</h2><p class="xs faint">Automatik setiap 24 jam · ${s.backups.length} salinan disimpan</p></div>
            <button class="btn btn-primary btn-sm" data-act="runBackup">${icon('refresh')} Sandaran sekarang</button></div>
          ${s.backups.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Fail</th><th>Saiz</th><th>Masa</th><th></th></tr></thead><tbody>
            ${s.backups.map((b) => `<tr><td class="mono xs">${esc(b.name)}</td><td class="small">${fmtBytes(b.size)}</td><td class="small faint">${fmtDateTime(b.created_at)}</td>
              <td class="right"><a class="btn btn-ghost btn-sm" ${b.url ? `href="${esc(b.url)}" target="_blank" rel="noopener"` : `href="/api/admin/backups/${encodeURIComponent(b.name)}" download`}>${icon('upload')} Muat turun</a></td></tr>`).join('')}
          </tbody></table></div>` : emptyState('package', 'Tiada sandaran', 'Tekan "Sandaran sekarang" untuk membuat salinan pertama.')}
          <div class="card-body"><p class="xs faint">Untuk memulihkan: hentikan pelayan, gantikan <code>data/upsihub.db</code> dengan fail sandaran, kemudian mulakan semula.</p></div>
        </section>
        <section class="card">
          <div class="card-head"><h2 class="section-title">Rekod</h2></div>
          <div class="card-body"><dl class="kv">${Object.entries(s.tables).map(([t, n]) => `<dt>${esc(TABLE_LABEL[t] || t)}</dt><dd>${n.toLocaleString('ms-MY')}</dd>`).join('')}</dl></div>
          <div class="card-body" style="border-top:1px solid var(--border)">
            <div class="label" style="margin-bottom:6px">Peraturan perlindungan data (${s.triggers.length})</div>
            <div class="row-wrap">${s.triggers.map((t) => `<span class="badge green">${icon('lock')} ${esc(t.replace(/^trg_/, ''))}</span>`).join('')}</div>
          </div>
        </section>
      </div>
    </div>`;
}

    el.closest('.thumb-add').innerHTML = '<span class="spinner"></span>';
    try {
      for (const f of files) list.push(await uploadImage(f));
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      redrawImagesField(scope, name, list);
    }
  },
  async pickImage(el) {
    const file = el.files?.[0];
    if (!file) return;
    const name = el.dataset.target;
    const form = el.closest('form') || document;
    const preview = form.querySelector(`[data-preview="${name}"]`);
    preview.innerHTML = '<span class="spinner"></span>';
    try {
      const url = await uploadImage(file);
      form.querySelector(`input[name="${name}"]`).value = url;
      preview.innerHTML = `<img src="${esc(url)}" alt="">`;
      form.querySelector(`[data-act="clearImage"][data-target="${name}"]`)?.classList.remove('hidden');
    } catch (err) {
      preview.innerHTML = icon('image');
      toast(err.message, 'error');
    } finally {
      el.value = '';
    }
  }
});

// ---------- event delegation (CSP forbids inline handlers) ----------
const run = (fn, ...args) => Promise.resolve().then(() => fn(...args)).catch((err) => toast(err.message, 'error'));
document.addEventListener('click', (e) => {
  if (e.target.matches?.('[data-overlay]')) { closeOverlay(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) {
    const pop = document.querySelector('.popover');
    if (pop && !pop.contains(e.target) && !e.target.closest('[data-act^="open"]')) pop.remove();
    return;
  }
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  run(fn, el, e);
});
document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  if (!fn) return;
  const btn = form.querySelector('[type=submit]') || document.querySelector(`[form="${form.id}"][type=submit]`);
  setBusy(btn, true);
  try { await fn(Object.fromEntries(new FormData(form)), form, e.submitter); } catch (err) { toast(err.message, 'error'); } finally { setBusy(btn, false); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change]) run(changes[el.dataset.change], el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]');
  if (el && inputs[el.dataset.input]) run(inputs[el.dataset.input], el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.querySelector('.lightbox')) document.querySelector('.lightbox').remove();
    else if (overlayOpen()) closeOverlay();
    else document.querySelector('.popover')?.remove();
  }
});

window.addEventListener('hashchange', router);
window.addEventListener('uh:refresh', router);
window.addEventListener('uh:shell', renderShell);
window.addEventListener('uh:cart', renderShell);
window.addEventListener('uh:auth', async () => { await loadMe().catch(() => {}); router(); });

hooks.loadMe = loadMe;
hooks.renderShell = renderShell;

// =====================================================================
// BOOT
// =====================================================================
(async function boot() {
  try {
    [state.config] = await Promise.all([api('GET', '/api/config'), loadMe()]);
    if (state.config.announcement) document.getElementById('announceText').textContent = state.config.announcement;
    else document.getElementById('announce').classList.add('hidden');
  } catch (err) {
    view.innerHTML = emptyState('alert', 'Tidak dapat menyambung ke pelayan', err.message, '<button class="btn btn-primary" data-act="reload">Cuba lagi</button>');
    return;
  }
  if (state.config.needs_admin && !state.me && !location.hash.startsWith('#/login')) location.replace('#/login');
  router();
  if (!GAS && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
})();



return { router, renderShell, loadMe, connectStream };
})();

})();
</script>
